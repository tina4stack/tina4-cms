name: Tests

on:
  push:
    branches: [main, main]
  pull_request:
    branches: [main, main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The committed composer.lock resolves PHP-8.4-only dev dependencies
        # (symfony/filesystem v8, doctrine/instantiator 2.1), so the suite can
        # only install on 8.4 until the lock is regenerated for 8.1 compatibility.
        php: ['8.4']

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          # Every ext the lock requires except interbase (Firebird — not needed
          # by the suite and not installable on the runner; ignored below).
          extensions: ctype, curl, dom, fileinfo, filter, iconv, json, mbstring, openssl, phar, sqlite3, tokenizer, xml, xmlwriter, zip
          coverage: none

      - name: Install dependencies
        # ext-interbase is required only by the optional tina4php-firebird dev
        # dependency (the Firebird driver), which these tests do not exercise.
        run: composer install --prefer-dist --no-progress --ignore-platform-req=ext-interbase

      - name: Run tests
        run: vendor/bin/phpunit
